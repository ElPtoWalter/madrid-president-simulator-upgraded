name: AutoMarket update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run AutoMarket updater
        run: node scripts/update-data.mjs

      - name: Commit updated data
        run: |
          git config user.name "AutoMarket Bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "AutoMarket: update rumors"
          git push
